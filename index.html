
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0718">
<title>Device Verification</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0b0718;
    --panel:#17112d;
    --panel2:#1d1638;
    --purple:#8957f5;
    --purple2:#665cf6;
    --green:#18c99a;
    --red:#ff5579;
    --muted:#9690ae;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    min-height:100%;
    background:var(--bg);
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 15% 15%,rgba(111,65,220,.16),transparent 32%),
        radial-gradient(circle at 90% 75%,rgba(77,70,200,.13),transparent 30%),
        var(--bg);
    color:#fff;
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
}

.app{
    position:relative;
    width:100%;
    max-width:460px;
    min-height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:linear-gradient(180deg,#100a20,#0b0718);
    border-left:1px solid rgba(255,255,255,.04);
    border-right:1px solid rgba(255,255,255,.04);
}

.background-effects{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.orb{
    position:absolute;
    width:13px;
    height:13px;
    border-radius:50%;
    background:rgba(133,104,255,.17);
    box-shadow:0 0 20px rgba(133,104,255,.15);
    animation:float 8s ease-in-out infinite;
}

.orb:nth-child(1){top:13%;left:18%}
.orb:nth-child(2){top:28%;right:12%;width:20px;height:20px;animation-delay:1s}
.orb:nth-child(3){top:54%;left:9%;animation-delay:2s}
.orb:nth-child(4){top:72%;right:15%;width:25px;height:25px;animation-delay:3s}
.orb:nth-child(5){top:87%;left:28%;width:9px;height:9px;animation-delay:4s}

@keyframes float{
    0%,100%{transform:translateY(0) translateX(0)}
    50%{transform:translateY(-28px) translateX(12px)}
}

.content{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:35px 0;
}

.user-card{
    margin:0 18px 24px;
    padding:16px;
    border-radius:24px;
    background:rgba(22,16,43,.92);
    border:1px solid rgba(255,255,255,.08);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    box-shadow:0 12px 35px rgba(0,0,0,.2);
    backdrop-filter:blur(12px);
}

.user-left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.user-avatar{
    width:54px;
    height:54px;
    flex-shrink:0;
    border-radius:50%;
    background:linear-gradient(135deg,#9258f8,#6358ef);
    border:2px solid #8e65ff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:21px;
    font-weight:700;
    box-shadow:0 0 18px rgba(137,87,245,.28);
    overflow:hidden;
}

.user-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-meta{
    min-width:0;
}

.user-meta .name{
    font-size:14px;
    font-weight:700;
    max-width:190px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.user-meta .id{
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
    font-family:monospace;
}

.verified-badge{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px 12px;
    border-radius:30px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.6px;
}

.verified-badge .dot{
    width:8px;
    height:8px;
    border-radius:50%;
}

.pending{
    background:rgba(255,184,77,.10);
    border:1px solid rgba(255,184,77,.25);
    color:#ffbd60;
}
.pending .dot{
    background:#ffbd60;
    animation:pulse 1s infinite;
}

.verified{
    background:rgba(24,201,154,.10);
    border:1px solid rgba(24,201,154,.28);
    color:var(--green);
}
.verified .dot{
    background:var(--green);
    box-shadow:0 0 10px var(--green);
}

.blocked{
    background:rgba(255,85,121,.10);
    border:1px solid rgba(255,85,121,.28);
    color:var(--red);
}
.blocked .dot{
    background:var(--red);
}

.already{
    background:rgba(115,103,255,.12);
    border:1px solid rgba(115,103,255,.28);
    color:#a99aff;
}
.already .dot{
    background:#a99aff;
}

@keyframes pulse{
    50%{opacity:.35}
}

.main-card{
    position:relative;
    margin:0 18px;
    padding:38px 22px 27px;
    text-align:center;
    border-radius:34px;
    background:
        radial-gradient(circle at 50% 0%,rgba(137,87,245,.12),transparent 42%),
        linear-gradient(145deg,rgba(30,22,57,.98),rgba(19,14,37,.98));
    border:1px solid rgba(157,124,255,.15);
    box-shadow:0 20px 55px rgba(0,0,0,.28);
    overflow:hidden;
    animation:cardIn .6s ease both;
}

.main-card:before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:linear-gradient(135deg,rgba(255,255,255,.035),transparent 45%);
    pointer-events:none;
}

@keyframes cardIn{
    from{opacity:0;transform:translateY(15px)}
    to{opacity:1;transform:translateY(0)}
}

.check-circle{
    width:112px;
    height:112px;
    margin:0 auto 25px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:53px;
    position:relative;
    z-index:1;
}

.check-circle.scanning{
    color:#fff;
    background:linear-gradient(135deg,#8957f5,#6258ed);
    box-shadow:0 0 0 10px rgba(137,87,245,.09),0 0 45px rgba(137,87,245,.35);
    animation:scanPulse 1.6s infinite;
}

.check-circle.success{
    background:linear-gradient(135deg,#20d6a5,#119e88);
    box-shadow:0 0 0 10px rgba(24,201,154,.10),0 0 45px rgba(24,201,154,.32);
    color:white;
    animation:successPop .65s cubic-bezier(.2,.8,.2,1) both;
}

.check-circle.failed{
    background:linear-gradient(135deg,#ff6688,#e52d59);
    box-shadow:0 0 0 10px rgba(255,85,121,.10),0 0 45px rgba(255,85,121,.3);
    color:white;
}

.check-circle.already{
    background:linear-gradient(135deg,#8973ff,#6656df);
    box-shadow:0 0 0 10px rgba(137,115,255,.10),0 0 45px rgba(137,115,255,.3);
    color:white;
}

@keyframes scanPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
}

@keyframes successPop{
    0%{transform:scale(.65);opacity:0}
    75%{transform:scale(1.1);opacity:1}
    100%{transform:scale(1)}
}

h1{
    position:relative;
    z-index:1;
    font-family:'Space Grotesk',sans-serif;
    font-size:27px;
    line-height:1.2;
    font-weight:700;
    margin-bottom:12px;
}

h1.scanning{color:#fff}
h1.success{color:var(--green)}
h1.failed{color:var(--red)}
h1.already{color:#a99aff}

.sub{
    position:relative;
    z-index:1;
    font-size:14px;
    line-height:1.65;
    color:var(--muted);
    margin-bottom:27px;
}

.purple-bar{
    height:9px;
    width:100%;
    background:rgba(255,255,255,.07);
    border-radius:30px;
    overflow:hidden;
    margin-bottom:29px;
}

.purple-fill{
    height:100%;
    width:0%;
    border-radius:30px;
    background:linear-gradient(90deg,#9857f8,#625ef5);
    box-shadow:0 0 15px rgba(137,87,245,.45);
    transition:width .35s ease;
}

.checks{
    display:flex;
    flex-direction:column;
    gap:17px;
    margin-bottom:32px;
    text-align:left;
}

.check{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12px;
    font-weight:600;
    letter-spacing:.5px;
}

.check-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.check-left .dot{
    width:8px;
    height:8px;
    flex-shrink:0;
    border-radius:50%;
}

.check.wait{color:#77718d}
.check.wait .dot{background:#77718d}

.check.done{color:var(--green)}
.check.done .dot{
    background:var(--green);
    box-shadow:0 0 10px var(--green);
}

.check.fail{color:var(--red)}
.check.fail .dot{
    background:var(--red);
    box-shadow:0 0 10px var(--red);
}

.check.already{color:#a99aff}
.check.already .dot{background:#a99aff}

.continue{
    position:relative;
    z-index:1;
    display:block;
    width:100%;
    min-height:60px;
    padding:16px;
    border:none;
    border-radius:19px;
    color:white;
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:transform .2s,filter .2s;
}

.continue:active{
    transform:scale(.97);
}

.continue.success{
    background:linear-gradient(100deg,#9258f8,#625cf4);
    box-shadow:0 10px 28px rgba(117,80,239,.28);
}

.continue.failed{
    background:linear-gradient(100deg,#ff6688,#e52d59);
    box-shadow:0 10px 28px rgba(229,45,89,.23);
}

.continue.already{
    background:linear-gradient(100deg,#8973ff,#6656df);
    box-shadow:0 10px 28px rgba(102,86,223,.25);
}

.sound-note{
    margin-top:19px;
    color:#77718d;
    font-size:11px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:7px;
}

.sound-note .sound-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
}

.foot{
    position:relative;
    z-index:1;
    padding:30px 15px 26px;
    text-align:center;
    font-size:12px;
    color:#706987;
    letter-spacing:.3px;
}

.hidden{
    display:none!important;
}

@media(max-width:360px){
    .main-card{padding:30px 17px 23px}
    h1{font-size:23px}
    .check{font-size:10px}
    .verified-badge{padding:8px 9px;font-size:9px}
    .user-meta .name{max-width:125px}
}

@media(prefers-reduced-motion:reduce){
    *,*:before,*:after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="background-effects">
        <span class="orb"></span>
        <span class="orb"></span>
        <span class="orb"></span>
        <span class="orb"></span>
        <span class="orb"></span>
    </div>

    <div class="content">

        <div class="user-card">

            <div class="user-left">
                <div class="user-avatar" id="avatar">U</div>

                <div class="user-meta">
                    <div class="name" id="userName">Loading...</div>
                    <div class="id" id="userId">ID: ...</div>
                </div>
            </div>

            <div class="verified-badge pending" id="badge">
                <span class="dot"></span>
                <span id="badgeText">SCANNING</span>
            </div>

        </div>

        <!-- SCANNING PANEL -->
        <div class="main-card" id="scanPanel">

            <div class="check-circle scanning" id="scanIcon">🛡️</div>

            <h1 class="scanning" id="scanTitle">
                Securing Your Device
            </h1>

            <div class="sub" id="scanSub">
                Analyzing your device security profile
            </div>

            <div class="purple-bar">
                <div class="purple-fill" id="scanBar"></div>
            </div>

            <div class="checks">

                <div class="check wait" id="check1">
                    <div class="check-left">
                        <span class="dot"></span>
                        DEVICE INTEGRITY
                    </div>
                    <div id="check1Right">⋯</div>
                </div>

                <div class="check wait" id="check2">
                    <div class="check-left">
                        <span class="dot"></span>
                        NETWORK SECURITY
                    </div>
                    <div id="check2Right">⋯</div>
                </div>

                <div class="check wait" id="check3">
                    <div class="check-left">
                        <span class="dot"></span>
                        SESSION VALIDATION
                    </div>
                    <div id="check3Right">⋯</div>
                </div>

            </div>

        </div>

        <!-- RESULT PANEL -->
        <div class="main-card hidden" id="resultPanel">

            <div class="check-circle success" id="resultIcon">✓</div>

            <h1 class="success" id="resultTitle">
                Verified Successfully
            </h1>

            <div class="sub" id="resultSub">
                Your device is secure and verified
            </div>

            <div class="purple-bar">
                <div class="purple-fill" id="resultBar" style="width:100%"></div>
            </div>

            <div class="checks" id="resultChecks"></div>

            <button class="continue success" id="continueBtn">
                Continue Securely
            </button>

            <div class="sound-note" id="resultNote">
                <span class="sound-dot"></span>
                <span id="resultNoteText">Device verification completed</span>
            </div>

        </div>

    </div>

    <div class="foot" id="watermark">
        © 2026 • Designed By ROX 🇮🇳
    </div>

</div>

<script>
(function(){

"use strict";

const qs = new URLSearchParams(location.search);

const HASH = qs.get('hash') || qs.get('bot_hash') || '';
const USER_ID = qs.get('user_id') || '';
const BOT_ID = qs.get('id') || qs.get('bot_id') || '';
const URL_USERNAME = qs.get('username') || '';

const $ = id => document.getElementById(id);

const tg = window.Telegram && window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if(tg){
    try{
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0b0718');
        tg.setBackgroundColor('#0b0718');
    }catch(e){}
}

/* USER PROFILE */

let realUsername = URL_USERNAME;
let displayName = 'User';
let displayId = USER_ID;
let avatarLetter = 'U';

if(tg && tg.initDataUnsafe && tg.initDataUnsafe.user){

    const user = tg.initDataUnsafe.user;

    realUsername = user.username || URL_USERNAME || '';

    displayName =
        ((user.first_name || '') + ' ' + (user.last_name || '')).trim()
        || realUsername
        || 'User';

    displayId = String(user.id);

    avatarLetter = (user.first_name || 'U')[0].toUpperCase();

    $('userName').textContent =
        displayName + (user.username ? ' @' + user.username : '');

    $('userId').textContent = 'ID: ' + displayId;
    $('avatar').textContent = avatarLetter;

    if(user.photo_url){
        const img = document.createElement('img');
        img.src = user.photo_url;
        img.alt = 'Avatar';
        $('avatar').replaceChildren(img);
    }

}else{

    if(URL_USERNAME){
        displayName = URL_USERNAME;
        avatarLetter = URL_USERNAME[0].toUpperCase();
    }

    $('userName').textContent = displayName;
    $('userId').textContent = 'ID: ' + displayId;
    $('avatar').textContent = avatarLetter;
}

/* FOOTER */

$('watermark').addEventListener('click',function(){
    window.open('https://t.me/ROXXOP','_blank');
});

/* SMALL HELPERS */

function sleep(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}

async function sha256(value){

    const buffer = await crypto.subtle.digest(
        'SHA-256',
        new TextEncoder().encode(value)
    );

    return Array.from(new Uint8Array(buffer))
        .map(x => x.toString(16).padStart(2,'0'))
        .join('');
}

/* DEVICE FINGERPRINT */

async function collectFP(){

    const visitorId = await sha256(
        navigator.userAgent +
        screen.width +
        screen.height +
        navigator.language +
        Intl.DateTimeFormat().resolvedOptions().timeZone
    );

    const canvasEl = document.createElement('canvas');
    const ctx = canvasEl.getContext('2d');

    canvasEl.width = 240;
    canvasEl.height = 60;

    ctx.font = '14px Arial';
    ctx.fillStyle = '#123456';
    ctx.fillText('device-verification-fingerprint',2,25);

    const canvasHash = await sha256(canvasEl.toDataURL());

    let webglHash = 'no-webgl';

    try{

        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');

        if(gl){

            const dbg = gl.getExtension('WEBGL_debug_renderer_info');

            const renderer = dbg
                ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
                : 'no-webgl';

            webglHash = await sha256(renderer);
        }

    }catch(e){}

    return {

        bot_id:BOT_ID,
        id:BOT_ID,

        user_id:USER_ID || displayId,

        bot_hash:HASH,
        hash:HASH,

        visitorId:visitorId,
        information:visitorId,

        canvasHash:canvasHash,
        canvas:canvasHash,

        webglHash:webglHash,
        webgl:webglHash,

        screenInfo:screen.width + 'x' + screen.height,

        timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,

        tzOffset:new Date().getTimezoneOffset(),

        hardware:
            navigator.hardwareConcurrency + 'x' +
            (navigator.deviceMemory || 0),

        language:navigator.language,
        platform:navigator.platform,
        touchPoints:navigator.maxTouchPoints,

        ua:navigator.userAgent,

        initData:tg ? tg.initData : '',

        username:realUsername
    };
}

/* VIBRATION */

function vibrateSuccess(){

    try{

        if(navigator.vibrate){
            navigator.vibrate([120,60,180,60,120]);
        }

    }catch(e){}
}

/* SUCCESS SOUND */

function playSuccessSound(){

    try{

        const AudioContext =
            window.AudioContext || window.webkitAudioContext;

        if(!AudioContext) return;

        const audio = new AudioContext();

        if(audio.state === 'suspended'){
            audio.resume().catch(function(){});
        }

        const notes = [
            {frequency:523.25,start:0},
            {frequency:659.25,start:0.13},
            {frequency:783.99,start:0.26}
        ];

        notes.forEach(function(note){

            const oscillator = audio.createOscillator();
            const gain = audio.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.value = note.frequency;

            gain.gain.setValueAtTime(0.0001,audio.currentTime + note.start);
            gain.gain.exponentialRampToValueAtTime(
                0.12,
                audio.currentTime + note.start + 0.025
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                audio.currentTime + note.start + 0.22
            );

            oscillator.connect(gain);
            gain.connect(audio.destination);

            oscillator.start(audio.currentTime + note.start);
            oscillator.stop(audio.currentTime + note.start + 0.24);

        });

        setTimeout(function(){
            audio.close().catch(function(){});
        },1200);

    }catch(e){
        console.log('Sound unavailable:',e);
    }
}

/* CHECK ROWS */

function setCheck(id,state,rightId){

    $(id).className = 'check ' + state;

    if(rightId){
        $(rightId).textContent =
            state === 'done' || state === 'already'
            ? '✓'
            : state === 'fail'
            ? '✕'
            : '⋯';
    }
}

/* ERROR RESULT */

function showError(message){

    $('scanPanel').classList.add('hidden');
    $('resultPanel').classList.remove('hidden');

    $('badge').className = 'verified-badge blocked';
    $('badgeText').textContent = 'FAILED';

    $('resultIcon').className = 'check-circle failed';
    $('resultIcon').textContent = '⚠';

    $('resultTitle').className = 'failed';
    $('resultTitle').textContent = 'Verification Failed';

    $('resultSub').textContent =
        message || 'Please reopen verification and try again.';

    $('resultBar').style.width = '100%';

    $('resultChecks').innerHTML =
        '<div class="check fail">' +
        '<div class="check-left"><span class="dot"></span>VERIFICATION FAILED</div>' +
        '<div>✕</div></div>';

    $('continueBtn').className = 'continue failed';
    $('continueBtn').textContent = 'Continue to Bot';
