<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:380px;background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.08);padding:28px 22px;text-align:center;overflow:hidden}
.logo{width:64px;height:64px;background:#eef2ff;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}
.title{font-size:18px;font-weight:800;color:#0f172a;margin-bottom:6px}
.subtitle{font-size:13px;color:#64748b;line-height:1.5;margin-bottom:18px}
.status{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.status.loading{background:#dbeafe;color:#2563eb;animation:pulse 1.5s infinite}
.status.success{background:#dcfce7;color:#16a34a}
.status.error{background:#fee2e2;color:#dc2626}
.status.info{background:#fef3c7;color:#d97706}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.progress{width:100%;height:4px;background:#f1f5f9;border-radius:10px;overflow:hidden;margin:16px 0}
.progress-bar{height:100%;background:#2563eb;width:0%;transition:width 0.3s;border-radius:10px}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;transition:0.2s;margin-top:8px}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-error{background:#fee2e2;color:#dc2626}
.btn-info{background:#f1f5f9;color:#0f172a}
.hidden{display:none !important}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dot{width:6px;height:6px;border-radius:50%;background:#e2e8f0}
.dot.active{background:#2563eb}
.video-box{width:100%;height:140px;background:linear-gradient(135deg,#eef2ff,#dbeafe);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:16px}
</style>
</head>
<body>
<div class="container">
  <!-- LOADING -->
  <div id="loading">
    <div class="video-box">🔒</div>
    <div class="title">Verifying Your Device</div>
    <div class="subtitle" id="loading-msg">Checking device authenticity...</div>
    <div class="progress"><div class="progress-bar" id="progress"></div></div>
    <div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
  </div>

  <!-- SUCCESS -->
  <div id="success" class="hidden">
    <div class="status success"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5l10 -10"/></svg></div>
    <div class="title" id="success-title">Device Verified Successfully</div>
    <div class="subtitle" id="success-msg">Your device has been authenticated and secured.</div>
    <button class="btn btn-primary" onclick="Telegram.WebApp.close()">→ Continue to Dashboard</button>
  </div>

  <!-- ALREADY -->
  <div id="already" class="hidden">
    <div class="status info"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5l10 -10"/></svg></div>
    <div class="title">Already Verified</div>
    <div class="subtitle">Your device is already verified. Redirecting to main menu...</div>
    <button class="btn btn-info" onclick="Telegram.WebApp.close()">→ Go to Dashboard</button>
  </div>

  <!-- FAILED -->
  <div id="failed" class="hidden">
    <div class="status error"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></div>
    <div class="title" id="failed-title">Verification Failed</div>
    <div class="subtitle" id="failed-msg">We couldn't verify this device.</div>
    <div id="failed-buttons">
      <button class="btn btn-error" id="retry-btn" onclick="location.reload()">↻ Try Again</button>
      <div style="font-size:10px;color:#94a3b8;margin-top:10px">Contact Support</div>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); }

function getParams(){
  const url = new URL(window.location.href);
  return {
    bot_id: url.searchParams.get('id') || url.searchParams.get('botHash') || '',
    user_id: url.searchParams.get('user_id') || tg?.initDataUnsafe?.user?.id || '',
    username: url.searchParams.get('username') || tg?.initDataUnsafe?.user?.username || ''
  }
}

function getFingerprint(){
  const nav = navigator;
  const info = [nav.userAgent, nav.platform, nav.language, screen.width+'x'+screen.height, Intl.DateTimeFormat().resolvedOptions().timeZone].join('|');
  let hash=0; for(let i=0;i<info.length;i++){ hash=((hash<<5)-hash)+info.charCodeAt(i); hash|=0; }
  return 'fp_'+Math.abs(hash).toString(36)+'_'+btoa(info).slice(0,20);
}

function showState(id){
  ['loading','success','already','failed'].forEach(s=>{ document.getElementById(s).classList.add('hidden'); });
  document.getElementById(id).classList.remove('hidden');
}

async function collect(type='page_open'){
  const p = getParams();
  try{
    const ua = navigator.userAgent;
    const platform = navigator.platform;
    await fetch(`./verify.php?collect=1&id=${encodeURIComponent(p.bot_id)}&user_id=${encodeURIComponent(p.user_id)}&username=${encodeURIComponent(p.username)}&type=${type}&ua=${encodeURIComponent(ua)}&platform=${encodeURIComponent(platform)}`);
  }catch(e){}
}

async function verify(){
  const p = getParams();
  const visitorId = getFingerprint();
  const information = btoa(navigator.userAgent).slice(0,100);
  
  const payload = {
    bot_id: p.bot_id,
    id: p.bot_id,
    user_id: String(p.user_id),
    username: p.username,
    visitorId: visitorId,
    information: information,
    ua: navigator.userAgent,
    platform: navigator.platform
  };

  let progress = 0;
  const interval = setInterval(()=>{
    progress+= Math.random()*15;
    if(progress>90) progress=90;
    document.getElementById('progress').style.width = progress+'%';
  },200);

  try{
    const res = await fetch(`./verify.php?id=${encodeURIComponent(p.bot_id)}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const data = await res.json();
    clearInterval(interval);
    document.getElementById('progress').style.width='100%';

    // SEND TO BOT - Yehi se options.json banega tere bot me
    if(tg){
      try{ tg.sendData(JSON.stringify(data)); }catch(e){ console.log(e); }
    }

    setTimeout(()=>{
      if(data.status === 'success'){
        document.getElementById('success-title').textContent = data.title || 'Device Verified Successfully';
        document.getElementById('success-msg').textContent = data.message || 'Your device has been authenticated and secured.';
        showState('success');
        setTimeout(()=>{ if(tg) tg.close(); }, 1500);
      }
      else if(data.status === 'info' || data.status === 'already'){
        showState('already');
        setTimeout(()=>{ if(tg) tg.close(); }, 1500);
      }
      else{
        document.getElementById('failed-title').textContent = data.title || 'Verification Failed';
        document.getElementById('failed-msg').textContent = data.message || 'We could not verify this device.';
        
        // SAME DEVICE = NO TRY AGAIN BUTTON
        if((data.title && data.title.toLowerCase().includes('multiple')) || (data.message && data.message.toLowerCase().includes('already verified with another')) || data.error_type === 'same_device'){
          document.getElementById('failed-buttons').innerHTML = '<div style="font-size:11px;color:#ef4444;background:#fef2f2;padding:10px;border-radius:8px;margin-top:10px">This device is linked to another account and cannot be reused.</div><button class="btn btn-info" style="margin-top:12px" onclick="Telegram.WebApp.close()">→ Go to Dashboard</button>';
        }
        showState('failed');
        setTimeout(()=>{ if(tg) tg.close(); }, 2500);
      }
    },400);

  }catch(err){
    clearInterval(interval);
    document.getElementById('failed-msg').textContent = 'Network error. Please try again.';
    showState('failed');
  }
}

collect('page_open');
setTimeout(verify, 800);
</script>
</body>
</html>
