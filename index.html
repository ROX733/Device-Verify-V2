
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Device Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a14;color:#e7e7f0;font-family:'Inter',sans-serif;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:420px;background:linear-gradient(180deg,#0f0f1f 0%,#0a0a14 100%);min-height:100vh;display:flex;flex-direction:column}
.content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0}
.user-card{margin:0 16px 20px;background:#151328;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:16px;display:flex;align-items:center;justify-content:space-between}
.user-left{display:flex;align-items:center;gap:12px}
.user-avatar{width:48px;height:48px;border-radius:50%;background:#1f1d3a;border:2px solid #8b5cf6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-meta .name{font-weight:700;font-size:15px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-meta .id{font-size:11px;color:#8a8aa0;margin-top:3px;font-family:monospace}
.verified-badge{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;font-size:11px;font-weight:700}
.verified-badge.pending{background:rgba(255,184,77,.12);border:1px solid rgba(255,184,77,.3);color:#ffb84d}
.verified-badge.verified{background:rgba(29,216,129,.12);border:1px solid rgba(29,216,129,.3);color:#1dd881}
.verified-badge.blocked{background:rgba(255,93,108,.12);border:1px solid rgba(255,93,108,.3);color:#ff5d6c}
.verified-badge.already{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);color:#3b82f6}
.verified-badge .dot{width:8px;height:8px;border-radius:50%}
.pending .dot{background:#ffb84d;box-shadow:0 0 8px #ffb84d;animation:pulse 1s infinite}
.verified .dot{background:#1dd881;box-shadow:0 0 8px #1dd881}
.blocked .dot{background:#ff5d6c;box-shadow:0 0 8px #ff5d6c}
.already .dot{background:#3b82f6;box-shadow:0 0 8px #3b82f6}
.main-card{margin:0 16px;background:#151328;border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:32px 22px 24px;text-align:center}
.check-circle{width:92px;height:92px;margin:0 auto 20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px}
.check-circle.scanning{background:#1f1d3a;border:2px solid #8b5cf6;animation:spinPulse 1.5s infinite}
.check-circle.success{background:#1dd881;box-shadow:0 0 50px rgba(29,216,129,.5);color:#fff}
.check-circle.failed{background:#ff5d6c;box-shadow:0 0 50px rgba(255,93,108,.5);color:#fff}
.check-circle.already{background:#3b82f6;box-shadow:0 0 50px rgba(59,130,246,.5);color:#fff}
@keyframes spinPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
h1{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-bottom:8px}
h1.success{color:#1dd881}
h1.failed{color:#ff5d6c}
h1.scanning{color:#e7e7f0}
h1.already{color:#3b82f6}
.sub{font-size:13px;color:#8a8aa0;margin-bottom:20px;line-height:1.5}
.purple-bar{height:8px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;margin-bottom:24px}
.purple-fill{height:100%;width:0%;background:#8b5cf6;border-radius:999px;transition:width .4s}
.checks{text-align:left;display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.check{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:500}
.check-left{display:flex;align-items:center;gap:10px}
.check-left .dot{width:7px;height:7px;border-radius:50%}
.check.wait .check-left{color:#6a6a80}
.check.wait .dot{background:#6a6a80}
.check.done .check-left{color:#1dd881}
.check.done .dot{background:#1dd881;box-shadow:0 0 6px #1dd881}
.check.fail .check-left{color:#ff5d6c}
.check.fail .dot{background:#ff5d6c;box-shadow:0 0 6px #ff5d6c}
.check.already .check-left{color:#3b82f6}
.check.already .dot{background:#3b82f6;box-shadow:0 0 6px #3b82f6}
.continue{width:100%;padding:16px;border:none;border-radius:16px;font-weight:700;font-size:15px;cursor:pointer}
.continue.success{background:#8b5cf6;color:#fff}
.continue.failed{background:#ff5d6c;color:#fff}
.continue.already{background:#3b82f6;color:#fff}
.foot{padding:20px;text-align:center;font-size:11px;color:#5a5a70;cursor:pointer}
.hidden{display:none!important}
</style>
</head>

<body>
<div class="app">
<div class="content">

<div class="user-card">
<div class="user-left">
<div class="user-avatar" id="avatar">U</div>
<div class="user-meta">
<div class="name" id="userName">Loading...</div>
<div class="id" id="userId">ID: ...</div>
</div>
</div>
<div class="verified-badge pending" id="badge">
<span class="dot"></span>
<span id="badgeText">PENDING</span>
</div>
</div>

<div class="main-card" id="scanPanel">
<div class="check-circle scanning" id="scanIcon">🛡️</div>
<h1 class="scanning" id="scanTitle">Securing Your Device</h1>
<div class="sub" id="scanSub">Analyzing security profile</div>

<div class="purple-bar">
<div class="purple-fill" id="scanBar"></div>
</div>

<div class="checks">
<div class="check wait" id="check1">
<div class="check-left"><span class="dot"></span>DEVICE INTEGRITY</div>
<div id="check1Right">⋯</div>
</div>

<div class="check wait" id="check2">
<div class="check-left"><span class="dot"></span>NETWORK SECURITY</div>
<div id="check2Right">⋯</div>
</div>

<div class="check wait" id="check3">
<div class="check-left"><span class="dot"></span>SESSION VALIDATION</div>
<div id="check3Right">⋯</div>
</div>
</div>
</div>

<div class="main-card hidden" id="resultPanel">
<div class="check-circle success" id="resultIcon">✓</div>
<h1 class="success" id="resultTitle">Verified Successfully</h1>
<div class="sub" id="resultSub">Your device is secure and verified</div>

<div class="purple-bar">
<div class="purple-fill" style="width:100%"></div>
</div>

<div class="checks" id="resultChecks"></div>
<button class="continue success" id="continueBtn">Continue Securely</button>
</div>

</div>

<div class="foot" id="watermark">
Designed By ROX 🇮🇳 • Click to contact
</div>
</div>

<script>
(function(){

const qs = new URLSearchParams(location.search);

const HASH = qs.get('hash') || qs.get('bot_hash') || '';
const USER_ID = qs.get('user_id') || '';
const BOT_ID = qs.get('id') || qs.get('bot_id') || '';
const URL_USERNAME = qs.get('username') || '';

const $ = id => document.getElementById(id);

const tg = window.Telegram && window.Telegram.WebApp
    ? window.Telegram.WebApp : null;

if(tg){
    try{
        tg.ready();
        tg.expand();
    }catch(e){}
}

let realUsername = URL_USERNAME;
let displayName = 'User';
let displayId = USER_ID;
let avatarLetter = 'U';

if(tg && tg.initDataUnsafe && tg.initDataUnsafe.user){

    const u = tg.initDataUnsafe.user;

    realUsername = u.username || URL_USERNAME || '';

    displayName =
        ((u.first_name || '') + ' ' + (u.last_name || '')).trim()
        || realUsername || 'User';

    displayId = String(u.id);

    avatarLetter = (u.first_name || 'U')[0].toUpperCase();

    $('userName').textContent =
        displayName + (u.username ? ' @' + u.username : '');

    $('userId').textContent = 'ID: ' + displayId;
    $('avatar').textContent = avatarLetter;

    if(u.photo_url){
        const img = document.createElement('img');
        img.src = u.photo_url;
        img.alt = 'Avatar';
        $('avatar').replaceChildren(img);
    }

}else{

    if(URL_USERNAME){
        displayName = URL_USERNAME;
        avatarLetter = URL_USERNAME[0].toUpperCase();
    }

    $('userName').textContent = displayName;
    $('userId').textContent = 'ID: ' + displayId;
    $('avatar').textContent = avatarLetter;
}

$('watermark').onclick = () => {
    window.open('https://t.me/ROXXOP','_blank');
};

async function sha256(s){

    const b = await crypto.subtle.digest(
        'SHA-256',
        new TextEncoder().encode(s)
    );

    return Array.from(new Uint8Array(b))
        .map(x => x.toString(16).padStart(2,'0'))
        .join('');
}

async function collectFP(){

    const visitorId = await sha256(
        navigator.userAgent +
        screen.width +
        navigator.language +
        Intl.DateTimeFormat().resolvedOptions().timeZone
    );

    const canvasEl = document.createElement('canvas');
    const ctx = canvasEl.getContext('2d');

    ctx.font = '14px Arial';
    ctx.fillText('fp-' + USER_ID,2,2);

    const canvasHash = await sha256(canvasEl.toDataURL());

    let webglHash = 'no-webgl';

    try{

        const c = document.createElement('canvas');
        const gl = c.getContext('webgl');

        if(gl){
            const dbg = gl.getExtension('WEBGL_debug_renderer_info');

            const renderer = dbg
                ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
                : 'no-webgl';

            webglHash = await sha256(renderer);
        }

    }catch(e){}

    return {
        bot_id:BOT_ID,
        id:BOT_ID,
        user_id:USER_ID || displayId,
        bot_hash:HASH,
        hash:HASH,

        visitorId:visitorId,
        information:visitorId,

        canvasHash:canvasHash,
        canvas:canvasHash,

        webglHash:webglHash,
        webgl:webglHash,

        screenInfo:screen.width + 'x' + screen.height,

        timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
        tzOffset:new Date().getTimezoneOffset(),

        hardware:
            navigator.hardwareConcurrency + 'x' +
            (navigator.deviceMemory || 0),

        language:navigator.language,
        platform:navigator.platform,
        touchPoints:navigator.maxTouchPoints,

        ua:navigator.userAgent,
        initData:tg ? tg.initData : '',
        username:realUsername
    };
}

function showError(message){

    $('scanPanel').classList.add('hidden');
    $('resultPanel').classList.remove('hidden');

    $('badge').className = 'verified-badge blocked';
    $('badgeText').textContent = 'ERROR';

    $('resultIcon').className = 'check-circle failed';
    $('resultIcon').textContent = '⚠️';

    $('resultTitle').className = 'failed';
    $('resultTitle').textContent = 'Verification Failed';

    $('resultSub').textContent = message;

    $('resultChecks').innerHTML =
        '<div class="check fail">' +
        '<div class="check-left"><span class="dot"></span>SERVER RESPONSE</div>' +
        '<div class="check-right">✕</div></div>';

    $('continueBtn').className = 'continue failed';
    $('continueBtn').textContent = 'Close';

    $('continueBtn').onclick = () => {
        if(tg) tg.close();
    };
}

function showResult(data){

    $('scanPanel').classList.add('hidden');
    $('resultPanel').classList.remove('hidden');

    let html = '';

    if(data.status === 'success'){

        $('badge').className = 'verified-badge verified';
        $('badgeText').textContent = 'VERIFIED';

        $('resultIcon').className = 'check-circle success';
        $('resultIcon').textContent = '✓';

        $('resultTitle').className = 'success';
        $('resultTitle').textContent = 'Verified Successfully';

        $('resultSub').textContent =
            'Your device is secure and verified';

        $('continueBtn').className = 'continue success';

        html =
            '<div class="check done"><div class="check-left"><span class="dot"></span>DEVICE INTEGRITY</div><div>✓</div></div>' +
            '<div class="check done"><div class="check-left"><span class="dot"></span>NETWORK SECURITY</div><div>✓</div></div>' +
            '<div class="check done"><div class="check-left"><span class="dot"></span>SESSION VALIDATION</div><div>✓</div></div>';

    }else if(data.status === 'info'){

        $('badge').className = 'verified-badge already';
        $('badgeText').textContent = 'VERIFIED';

        $('resultIcon').className = 'check-circle already';
        $('resultIcon').textContent = '✓';

        $('resultTitle').className = 'already';
        $('resultTitle').textContent = 'Already Verified';

        $('resultSub').textContent =
            'Your device is already verified';

        $('continueBtn').className = 'continue already';

        html =
            '<div class="check already"><div class="check-left"><span class="dot"></span>DEVICE INTEGRITY</div><div>✓</div></div>';

    }else if(
        (data.title || '').toLowerCase().includes('used device')
    ){

        $('badge').className = 'verified-badge already';
        $('badgeText').textContent = 'ALLOWED';

        $('resultIcon').className = 'check-circle already';
        $('resultIcon').textContent = '✓';

        $('resultTitle').className = 'already';
        $('resultTitle').textContent = 'Device Already Used';

        $('resultSub').textContent =
            'Same device detected. You are still allowed to continue.';

        $('continueBtn').className = 'continue already';

        html =
            '<div class="check already"><div class="check-left"><span class="dot"></span>SAME DEVICE DETECTED</div><div>✓</div></div>' +
            '<div class="check already"><div class="check-left"><span class="dot"></span>ACCESS ALLOWED</div><div>✓</div></div>';

    }else{

        $('badge').className = 'verified-badge blocked';
        $('badgeText').textContent = 'BLOCKED';

        $('resultIcon').className = 'check-circle failed';
        $('resultIcon').textContent = '⚠️';

        $('resultTitle').className = 'failed';
        $('resultTitle').textContent = data.title || 'Verification Failed';

        $('resultSub').textContent =
            data.message || 'Please try again.';

        $('continueBtn').className = 'continue failed';

        html =
            '<div class="check fail"><div class="check-left"><span class="dot"></span>VERIFICATION FAILED</div><div>✕</div></div>';
    }

    $('resultChecks').innerHTML = html;

    $('continueBtn').onclick = () => {
        if(tg) tg.close();
    };
}

async function run(){

    if(!HASH || !USER_ID || !BOT_ID){
        showError('Invalid verification link. Reopen your bot.');
        return;
    }

    if(!tg || !tg.initData){
        showError('Please open this page inside Telegram.');
        return;
    }

    if(String(tg.initDataUnsafe?.user?.id || '') !== String(USER_ID)){
        showError('Telegram account does not match this verification link.');
        return;
    }

    let fp;

    try{
        fp = await collectFP();
    }catch(e){
        showError('Unable to collect device information.');
        return;
    }

    let pct = 0;
    let finished = false;

    const timer = setInterval(async () => {

        if(finished) return;

        pct += Math.random() * 10;

        $('scanBar').style.width = Math.min(100,pct) + '%';

        if(pct >= 40){
            $('check1').className = 'check done';
            $('check1Right').textContent = '✓';
        }

        if(pct >= 70){
            $('check2').className = 'check done';
            $('check2Right').textContent = '✓';
        }

        if(pct >= 90){
            $('check3').className = 'check done';
            $('check3Right').textContent = '✓';
        }

        if(pct >= 100){

            finished = true;
            clearInterval(timer);

            $('scanBar').style.width = '100%';

            try{

                const response = await fetch(
                    'https://device-verification-v2.onrender.com/verify.php',
                    {
                        method:'POST',
                        headers:{
                            'Content-Type':'application/json'
                        },
                        body:JSON.stringify(fp)
                    }
                );

                const data = await response.json();

                if(!response.ok){
                    throw new Error(
                        data.message || 'Server rejected the request.'
                    );
                }

                if(data.callback_delivered !== true){
                    showError(
                        'Bot callback failed. Please contact the administrator.'
                    );
                    return;
                }

                showResult(data);

            }catch(error){

                console.error('Verification error:',error);

                showError(
                    error.message || 'Server connection failed.'
                );
            }
        }

    },300);
}

run();

})();
</script>

</body>
</html>
